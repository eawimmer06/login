spring.application.name=login-registration-app
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/login_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Set APP_ADMIN_INVITE_CODE in your environment to allow approved admin registrations.
# Do not commit a real invite code or database password to source control.
app.security.admin-invite-code=${APP_ADMIN_INVITE_CODE:}
